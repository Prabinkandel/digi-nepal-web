<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Digi Nepal Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo"><img src="logo.png" style="width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px"/> Digi Nepal</div>
      <h1 class="login-title">Admin Login</h1>
      <p class="login-sub">Sign in to manage your store</p>
      <div id="login-error" class="login-error" hidden></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="l-email" placeholder="admin@diginepal.com" value="admin@diginepal.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="l-pass" placeholder="••••••••" value="admin123" required/>
        </div>
        <button type="submit" class="btn-primary full" id="login-btn">Login to Admin</button>
      </form>
    </div>
  </div>

  <!-- ADMIN APP -->
  <div id="admin-app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><img src="logo.png" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px"/> Digi Nepal</div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" href="#"><span>📊</span> Dashboard</a>
        <a class="nav-item" data-page="products" href="#"><span>📦</span> Products</a>
        <a class="nav-item" data-page="categories" href="#"><span>🗂️</span> Categories</a>
        <a class="nav-item" data-page="orders" href="#"><span>🛒</span> Orders</a>
        <a class="nav-item" data-page="offers" href="#"><span>🔥</span> Flash Offers</a>
        <a class="nav-item" data-page="payments" href="#"><span>💳</span> Payments</a>
        <a class="nav-item" data-page="users" href="#"><span>👥</span> Users</a>
      </nav>
      <div class="sidebar-footer">
        <div id="admin-name-display"></div>
        <button class="btn-logout" id="admin-logout">Logout</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <a href="/" target="_blank" class="btn-outline-sm">View Store →</a>
      </header>
      <main class="page-content" id="page-content"></main>
    </div>
  </div>

  <!-- DRAWER (add/edit forms) -->
  <div class="drawer-overlay" id="drawer-overlay" hidden>
    <div class="drawer" id="drawer">
      <div class="drawer-header">
        <h3 id="drawer-title">Form</h3>
        <button class="drawer-close" id="drawer-close">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>

  <!-- CONFIRM DIALOG -->
  <div class="confirm-overlay" id="confirm-overlay" hidden>
    <div class="confirm-box">
      <div class="confirm-icon">⚠️</div>
      <div id="confirm-msg">Are you sure?</div>
      <div class="confirm-actions">
        <button class="btn-outline-sm" id="confirm-no">Cancel</button>
        <button class="btn-danger" id="confirm-yes">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="a-toast"></div>
  <script src="admin.js"></script>
</body>
</html>
